schemaVersion: 1
id: utility-bill-pay
version: 1
description: Navigation sample only. No payment is executed or claimed.
initialStage: menu
stages:
  - id: menu
    goal: Select a billing enquiry.
    scripted:
      ssml: "Press 1 for an electricity billing enquiry, 2 for water, or 0 to finish."
      menu:
        '1': { transition: electricity }
        '2': { transition: water }
        '0': { transition: finish }
    transitions:
      - { to: enquiry, label: electricity }
      - { to: enquiry, label: water }
      - { to: complete, label: finish }
  - id: enquiry
    scripted:
      ssml: "This sample does not connect to a billing system. Press 0 to return."
      menu:
        '0': { transition: back }
    transitions:
      - { to: menu, label: back }
  - id: complete
    terminal: true
    terminalOutcome: success
    scripted:
      ssml: "Thank you. Goodbye."
