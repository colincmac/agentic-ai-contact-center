schemaVersion: 1
id: banking-main
version: 1
description: Modality-neutral navigation example. No account operations are performed.
initialStage: welcome
stages:
  - id: welcome
    goal: Select a banking service.
    realtime:
      instructions:
        - Explain that this is a navigation demonstration, not a live banking service.
        - Use advance to choose the requested service.
    nlu:
      intents:
        - { name: balance, description: Balance enquiry, transition: balance }
        - { name: done, description: Finish, transition: done }
    scripted:
      ssml: "This is a sample. Press 1 for balance information or 0 to finish."
      menu:
        '1': { transition: balance }
        '0': { transition: done }
    transitions:
      - { to: information, label: balance }
      - { to: closing, label: done }
  - id: information
    goal: Explain that no real account is connected.
    realtime:
      instructions:
        - Do not invent an account balance. No account system is connected.
        - Use advance with done to finish.
    nlu:
      intents:
        - { name: done, description: Finish, transition: done }
    scripted:
      ssml: "No account system is connected. Press 0 to finish."
      menu:
        '0': { transition: done }
    transitions:
      - { to: closing, label: done }
  - id: closing
    terminal: true
    terminalOutcome: success
    realtime:
      instructions: ["Thank the caller. Do not claim that an account operation occurred."]
    scripted:
      ssml: "Thank you. Goodbye."
